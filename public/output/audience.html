<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Audience Output</title>
  <link rel="stylesheet" href="../fonts/fonts.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      cursor: none;
    }
    #output-root {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="output-root"></div>
  <script src="audience-render.js"></script>
  <script>
    const root = document.getElementById('output-root')
    // Text size follows the screen's area, not just its width, so 4:3 and portrait screens aren't left sparse
    const scale = () => Math.sqrt((window.innerWidth * window.innerHeight) / (1920 * 1080))
    const viewport = () => ({ w: window.innerWidth, h: window.innerHeight })

    let lastState = null
    const paint = () => renderAudienceState(lastState, root, scale(), viewport())
    const paintWithTransition = () => transitionAudience(lastState, root, scale(), lastState && lastState.transition, viewport())

    if (window.electronAPI && window.electronAPI.onAudienceUpdate) {
      window.electronAPI.onAudienceUpdate((state) => {
        lastState = state
        paintWithTransition()
      })
    }
    window.addEventListener('resize', paint)
  </script>
</body>
</html>
