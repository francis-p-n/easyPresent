<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presenter View</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; color: #fff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { display: flex; justify-content: space-between; align-items: baseline; padding: 1.5vh 3vw; color: #9aa; font-size: 2.4vh; }
    #clock { font-size: 5vh; color: #fff; font-variant-numeric: tabular-nums; }
    #timer { color: #ffcc00; font-size: 4vh; font-variant-numeric: tabular-nums; }
    #stale-bar { display: none; background: #b42318; color: #fff; text-align: center; font-size: 3.4vh; font-weight: bold; padding: 1vh 2vw; }
    body.stale #stale-bar { display: block; }
    body.stale main { opacity: .3; filter: grayscale(1); }
    #logo-bar { display: none; background: #1f4f8f; color: #fff; text-align: center; font-size: 3.4vh; font-weight: bold; padding: 1vh 2vw; }
    #current.idle { border-color: #555; background: #111; }
    #current.idle .tag { color: #99a; }
    #current.covered { opacity: .45; border-color: #1f4f8f; }
    #message { display: none; background: #c0392b; color: #fff; text-align: center; font-size: 4vh; font-weight: bold; padding: 1.2vh 2vw; }
    main { flex: 1; display: flex; flex-direction: column; padding: 0 3vw 2vh; gap: 2vh; min-height: 0; }
    .panel { border-radius: 1vh; padding: 2vh 2.5vw; overflow: hidden; }
    #current { flex: 3; background: #101c10; border: 0.4vh solid #2ecc71; display: flex; flex-direction: column; justify-content: center; }
    #next { flex: 1.3; background: #151515; border: 0.3vh solid #444; display: flex; flex-direction: column; justify-content: center; }
    .tag { font-size: 3vh; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 1vh; color: #2ecc71; }
    #next .tag { color: #8899aa; }
    .text { white-space: pre-wrap; line-height: 1.25; font-weight: 600; }
    .panel { min-height: 0; }
    #current .text { font-size: 7vh; }
    #next .text { font-size: 3.6vh; color: #cfd6dd; }
    .fit { overflow: hidden; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; justify-content: center; }
    .sect { display: block; font-size: .6em; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #8fb4ff; margin-bottom: .3em; }
    .empty { color: #a3acb8; font-style: italic; }
    #conn { position: fixed; bottom: .8vh; right: 1vw; font-size: 2.2vh; color: #a3acb8; }
  </style>
</head>
<body>
  <header>
    <div id="title">Waiting for presentation…</div>
    <div><span id="timer"></span> &nbsp; <span id="clock"></span></div>
  </header>
  <div id="stale-bar" role="alert">NO SIGNAL — reconnecting. This screen may be out of date.</div>
  <div id="logo-bar" role="status">LOGO ON SCREEN — the congregation cannot see the slide</div>
  <div id="message" role="alert"></div>
  <main>
    <section class="panel" id="current" aria-live="polite"><div class="tag" id="current-tag">Now</div><div class="fit"><div class="text empty" id="current-text">Nothing on screen</div></div></section>
    <section class="panel" id="next"><div class="tag">Next</div><div class="fit"><div class="text" id="next-text"></div></div></section>
  </main>
  <div id="conn">connecting…</div>

  <script src="socket.io.min.js"></script>
  <script>
    // Chords are for the band's stage view — the speaker only wants words
    function stripChords(text) { return (text || '').replace(/\[[^\]]*\]/g, ''); }

    function render(s) {
      // After CLEAR ALL nothing is live, so don't leave the last song's name up as if it were
      document.getElementById('title').textContent = (s.current && s.title) || 'Presenter View';
      document.getElementById('timer').textContent = s.timer ? 'Timer ' + s.timer : '';
      document.getElementById('current').classList.toggle('idle', !s.current);

      const msg = document.getElementById('message');
      msg.style.display = s.message ? 'block' : 'none';
      msg.textContent = s.message || '';

      const logoBar = document.getElementById('logo-bar');
      logoBar.style.display = s.showLogo ? 'block' : 'none';
      document.getElementById('current').classList.toggle('covered', !!s.showLogo);

      const cur = document.getElementById('current-text');
      const tag = document.getElementById('current-tag');
      if (s.current) {
        cur.className = 'text';
        cur.textContent = stripChords(s.current.text);
        const pos = s.index != null ? ' · ' + (s.index + 1) + '/' + s.total : '';
        tag.textContent = 'Now' + (s.current.label ? ' — ' + s.current.label : '') + pos;
      } else {
        cur.className = 'text empty';
        cur.textContent = s.showLogo ? 'Logo on screen' : 'Nothing on screen';
        tag.textContent = 'Now';
      }

      const nxt = document.getElementById('next-text');
      if (s.next) {
        nxt.className = 'text';
        nxt.textContent = '';
        if (s.next.label) {
          // The section name is a heading, not a lyric line
          const sect = document.createElement('span');
          sect.className = 'sect';
          sect.textContent = s.next.label;
          nxt.appendChild(sect);
        }
        nxt.appendChild(document.createTextNode(stripChords(s.next.text)));
      } else {
        nxt.className = 'text empty';
        nxt.textContent = s.current ? 'End of presentation' : '';
      }
      fitAll();
    }

    // Shrink text until it fits its box — long slides must never spill out or hide the label
    function fit(textEl, maxVh) {
      const box = textEl.parentElement;
      let size = window.innerHeight * maxVh / 100;
      textEl.style.fontSize = size + 'px';
      while (textEl.scrollHeight > box.clientHeight && size > 12) {
        size *= 0.93;
        textEl.style.fontSize = size + 'px';
      }
    }
    function fitAll() {
      fit(document.getElementById('current-text'), 7);
      fit(document.getElementById('next-text'), 3.6);
    }
    window.addEventListener('resize', fitAll);

    function tick() {
      document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-US', { hour12: false });
    }
    tick(); setInterval(tick, 1000);

    const socket = io();
    const conn = document.getElementById('conn');
    socket.on('connect', () => { conn.textContent = ''; document.body.classList.remove('stale'); });
    const lost = () => { conn.textContent = 'disconnected — retrying…'; document.body.classList.add('stale'); };
    socket.on('disconnect', lost);
    socket.on('connect_error', lost);
    socket.on('live-state', render);
  </script>
</body>
</html>
