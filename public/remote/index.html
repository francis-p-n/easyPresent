<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #000; color: #fff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    header { padding: 12px 16px; color: #9aa; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    #title { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #conn { font-size: 13px; color: #a3acb8; }
    #conn.bad { color: #ff6b5e; }
    #login { margin: auto; padding: 24px; text-align: center; display: flex; flex-direction: column; gap: 14px; width: min(320px, 100%); }
    #login input { font-size: 32px; text-align: center; letter-spacing: .4em; padding: 12px; border-radius: 10px; border: 1px solid #444; background: #151515; color: #fff; }
    #login button, .ctl { font-size: 20px; font-weight: 700; border: 0; border-radius: 14px; color: #fff; background: #2b3a55; padding: 18px; cursor: pointer; }
    #error { color: #ff6b5e; min-height: 1.2em; font-size: 14px; }
    #remote { display: none; flex: 1; flex-direction: column; gap: 12px; padding: 0 16px 16px; }
    .panel { background: #151515; border: 1px solid #333; border-radius: 12px; padding: 12px 14px; }
    .tag { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #2ecc71; margin-bottom: 6px; }
    #next-panel .tag { color: #8899aa; }
    .text { white-space: pre-wrap; line-height: 1.3; font-size: 20px; font-weight: 600; max-height: 22vh; overflow: hidden; }
    .text.empty { color: #a3acb8; font-style: italic; font-weight: 400; }
    #buttons { display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; gap: 12px; }
    .row .ctl { flex: 1; min-width: 0; }
    .ctl.big { font-size: 28px; padding: 30px 18px; }
    .ctl[data-cmd="next"] { background: #1f7a3d; }
    .ctl[data-cmd="prev"] { background: #444; }
    .ctl[data-cmd="clear"], .ctl[data-cmd="clearSlide"] { background: #8f2a2a; }
    .ctl[data-cmd="logo"] { background: #1f4f8f; }
    .ctl:active { filter: brightness(1.3); }
  </style>
</head>
<body>
  <header>
    <div id="title">Remote</div>
    <div id="conn">connecting…</div>
  </header>

  <form id="login" autocomplete="off">
    <div>Enter the PIN shown on the operator's computer</div>
    <input id="pin" inputmode="numeric" pattern="[0-9]*" maxlength="4" aria-label="PIN" autofocus>
    <div id="error" role="alert"></div>
    <button type="submit">Connect</button>
  </form>

  <main id="remote">
    <section class="panel"><div class="tag" id="now-tag">Now</div><div class="text empty" id="now">Nothing on screen</div></section>
    <section class="panel" id="next-panel"><div class="tag">Next</div><div class="text empty" id="next"></div></section>
    <div id="buttons"></div>
  </main>

  <script src="socket.io.min.js"></script>
  <script>
    var socket = io();
    var pin = '';
    try { pin = sessionStorage.getItem('remotePin') || ''; } catch (e) {}
    var connEl = document.getElementById('conn');
    var errEl = document.getElementById('error');

    function stripChords(t) { return (t || '').replace(/\[[^\]]*\]/g, ''); }

    function send(cmd, cb) {
      socket.emit('remote-command', { cmd: cmd, pin: pin }, cb || function () {});
    }

    function show(authed) {
      document.getElementById('login').style.display = authed ? 'none' : 'flex';
      document.getElementById('remote').style.display = authed ? 'flex' : 'none';
    }

    function tryPin() {
      if (!pin) return show(false);
      send('check', function (res) {
        if (res && res.ok) {
          try { sessionStorage.setItem('remotePin', pin); } catch (e) {}
          errEl.textContent = '';
          show(true);
        } else {
          pin = '';
          try { sessionStorage.removeItem('remotePin'); } catch (e) {}
          errEl.textContent = 'Wrong PIN';
          show(false);
        }
      });
    }

    document.getElementById('login').addEventListener('submit', function (e) {
      e.preventDefault();
      pin = document.getElementById('pin').value.trim();
      tryPin();
    });

    socket.on('connect', function () { connEl.textContent = 'connected'; connEl.className = ''; tryPin(); });
    socket.on('disconnect', function () { connEl.textContent = 'no signal — reconnecting'; connEl.className = 'bad'; });

    socket.on('live-state', function (s) {
      document.getElementById('title').textContent = (s.current && s.title) || 'Remote';
      var now = document.getElementById('now');
      var tag = document.getElementById('now-tag');
      if (s.current) {
        now.className = 'text';
        now.textContent = stripChords(s.current.text);
        tag.textContent = 'Now' + (s.current.label ? ' — ' + s.current.label : '') + (s.index != null ? ' · ' + (s.index + 1) + '/' + s.total : '');
      } else {
        now.className = 'text empty';
        now.textContent = s.showLogo ? 'Logo on screen' : 'Nothing on screen';
        tag.textContent = 'Now';
      }
      var nxt = document.getElementById('next');
      if (s.next) { nxt.className = 'text'; nxt.textContent = stripChords(s.next.text); }
      else { nxt.className = 'text empty'; nxt.textContent = s.current ? 'End of presentation' : ''; }
    });

    // Buttons come from the operator's settings: consecutive buttons of the same size share a row
    function drawButtons(list) {
      var host = document.getElementById('buttons');
      host.textContent = '';
      var row = null, rowBig = null;
      (list || []).forEach(function (b) {
        if (!row || rowBig !== !!b.big || (!b.big && row.children.length >= 3) || (b.big && row.children.length >= 2)) {
          row = document.createElement('div');
          row.className = 'row';
          host.appendChild(row);
          rowBig = !!b.big;
        }
        var btn = document.createElement('button');
        btn.className = 'ctl' + (b.big ? ' big' : '');
        btn.dataset.cmd = b.cmd;
        btn.textContent = b.label;
        btn.addEventListener('click', function () {
          send(b.cmd, function (res) { if (res && res.error === 'bad-pin') { pin = ''; show(false); } });
          if (navigator.vibrate) navigator.vibrate(15);
        });
        row.appendChild(btn);
      });
    }
    socket.on('remote-config', drawButtons);
  </script>
</body>
</html>
