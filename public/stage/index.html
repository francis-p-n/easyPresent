<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Chords Stage Display</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px;
      overflow-x: hidden;
    }
    
    #slide-content {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .line {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      min-height: 3em; /* Ensure space for chords even if none */
    }

    /* Chord-free lines wrap as ordinary text instead of one word per column */
    .line.plain {
      display: block;
      min-height: 0;
      font-size: 3vw;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .chord-word {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      font-size: 3vw; /* Responsive font size; smaller than a single slide so a few sections fit at once */
    }

    .chord {
      color: #ffcc00;
      font-weight: bold;
      font-size: 0.6em;
      height: 1.2em; /* Reserve space for the chord */
      margin-bottom: 0.1em;
    }

    /* Keep the spaces that sit inside each chord chunk (and don't add any between chunks):
       a chord can fall mid-word, and it must not split the word apart */
    .lyric {
      display: inline-block;
      white-space: pre;
    }

    /* The whole song: the live section is lit, what is coming stays readable, what is past fades */
    .section {
      padding: 0.4em 0.6em;
      border-left: 0.35em solid transparent;
      border-radius: 6px;
      opacity: 0.85;
    }
    .section.live { border-left-color: #ffcc00; background: rgba(255, 204, 0, 0.12); opacity: 1; }
    .section.next { opacity: 1; }
    .section.done { opacity: 0.4; }
    .section-label {
      color: #a3acb8;
      font-size: 1.6vw;
      font-weight: bold;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.3em;
    }
    .section.live .section-label { color: #ffcc00; }
    section.section { scroll-margin-top: 20px; }

    /* Controls */
    .controls {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(30, 30, 30, 0.8);
      padding: 10px 20px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0.3;
      transition: opacity 0.3s;
      z-index: 100;
    }
    
    .controls:hover {
      opacity: 1;
    }

    .controls button {
      background: #444;
      border: none;
      color: white;
      font-size: 1.2rem;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
    }

    .controls button:hover {
      background: #666;
    }

    #transpo-val {
      font-size: 1.5rem;
      font-weight: bold;
      min-width: 40px;
      text-align: center;
    }
  </style>
</head>
<body>
  
  <div id="slide-content">Waiting for presentation to start...</div>

  <div class="controls">
    <button onclick="changeTextSize(-0.1)" aria-label="Smaller text">A-</button>
    <button onclick="changeTextSize(0.1)" aria-label="Larger text">A+</button>
    <button onclick="changeTransposition(-1)" aria-label="Down a half step">-</button>
    <div id="transpo-val">0</div>
    <button onclick="changeTransposition(1)" aria-label="Up a half step">+</button>
  </div>

  <!-- Vendored socket.io client: the server's built-in /socket.io/socket.io.js
       endpoint breaks once the main process is bundled (vite inlines socket.io,
       so its on-disk client-file lookup fails at runtime) -->
  <script src="socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
